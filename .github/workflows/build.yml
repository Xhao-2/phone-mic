name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    name: Windows server (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish single-file executable
        run: dotnet publish server/PhoneMicServer.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: publish/PhoneMicServer.exe
          if-no-files-found: error

  android:
    name: Android client (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu runner image already ships the Android SDK, so only the
      # two components this project pins are ensured here. A failure to
      # install is not fatal: the preinstalled ones are then used.
      - name: Prepare Android SDK
        run: |
          if command -v sdkmanager > /dev/null 2>&1; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          echo "ANDROID_HOME=${ANDROID_HOME}"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: [server, android]
    runs-on: ubuntu-latest
    steps:
      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename for humans
        run: |
          mkdir -p out
          cp artifacts/windows-exe/PhoneMicServer.exe out/PhoneMicServer.exe
          cp artifacts/android-apk/app-debug.apk out/PhoneMic.apk
          ls -l out

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.1.${{ github.run_number }}" \
            out/PhoneMicServer.exe out/PhoneMic.apk \
            --repo "${{ github.repository }}" \
            --title "PhoneMic v1.1.${{ github.run_number }}" \
            --notes "自动构建：Windows 服务端 PhoneMicServer.exe 与 Android 客户端 PhoneMic.apk。使用说明见 Wiki。"
